name: HuggingFace Video Shorts Generator

on:
  workflow_dispatch: # GitHub panelinden butona basarak çalıştırmak için
  # schedule:
  #   - cron: '0 10 * * *' # İleride her gün otomatik çalışması için

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install gradio_client

      - name: Videoyu Üret (Hugging Face GPU)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python main.py

      - name: Üretilen Videoyu İndirilebilir Yap (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olusturulan-shorts-videosu
          path: downloads/mini_cooking_asmr.mp4
